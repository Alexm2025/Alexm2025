<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="300" viewBox="0 0 1200 300" role="img" aria-label="Alex Mathew — Computer Engineering · AI Security · Full-Stack · Blockchain">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#070B14"/>
      <stop offset="0.55" stop-color="#0B1324"/>
      <stop offset="1" stop-color="#111733"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#2DD4BF"/>
      <stop offset="0.5" stop-color="#38BDF8"/>
      <stop offset="1" stop-color="#8B5CF6"/>
    </linearGradient>
    <radialGradient id="glow1" cx="0.85" cy="0.2" r="0.5">
      <stop offset="0" stop-color="#8B5CF6" stop-opacity="0.35"/>
      <stop offset="1" stop-color="#8B5CF6" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glow2" cx="0.1" cy="0.95" r="0.45">
      <stop offset="0" stop-color="#2DD4BF" stop-opacity="0.25"/>
      <stop offset="1" stop-color="#2DD4BF" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#1E293B" stroke-width="1"/>
    </pattern>
    <clipPath id="round"><rect width="1200" height="300" rx="18"/></clipPath>
    <style>
      .name{font:800 64px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;letter-spacing:-1px}
      .role{font:500 22px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#CBD5E1}
      .mono{font:500 15px 'Fira Code','JetBrains Mono',Consolas,monospace;fill:#64748B}
      .chip{font:600 14px 'Segoe UI',Inter,Helvetica,Arial,sans-serif;fill:#E2E8F0}
      .node{fill:#38BDF8}
      .pulse{animation:p 3s ease-in-out infinite}
      .pulse.d2{animation-delay:1s}.pulse.d3{animation-delay:2s}
      @keyframes p{0%,100%{opacity:.25}50%{opacity:1}}
      .flow{stroke-dasharray:6 10;animation:f 2.5s linear infinite}
      @keyframes f{to{stroke-dashoffset:-32}}
    </style>
  </defs>
  <g clip-path="url(#round)">
    <rect width="1200" height="300" fill="url(#bg)"/>
    <rect width="1200" height="300" fill="url(#grid)" opacity="0.55"/>
    <rect width="1200" height="300" fill="url(#glow1)"/>
    <rect width="1200" height="300" fill="url(#glow2)"/>

    <!-- network graphic -->
    <g transform="translate(860 40)" fill="none">
      <path class="flow" d="M40 60 L150 30 L250 90 L180 170 L60 190 Z M150 30 L180 170 M40 60 L250 90 M60 190 L250 90" stroke="url(#accent)" stroke-width="1.6" opacity="0.7"/>
      <g>
        <circle class="node pulse" cx="40" cy="60" r="6"/>
        <circle class="node pulse d2" cx="150" cy="30" r="7" fill="#2DD4BF"/>
        <circle class="node pulse d3" cx="250" cy="90" r="6" fill="#8B5CF6"/>
        <circle class="node pulse" cx="180" cy="170" r="8"/>
        <circle class="node pulse d2" cx="60" cy="190" r="5" fill="#2DD4BF"/>
      </g>
      <!-- shield -->
      <g transform="translate(118 72)">
        <path d="M30 0 L60 10 V34 C60 54 46 66 30 72 C14 66 0 54 0 34 V10 Z" fill="#0B1324" stroke="url(#accent)" stroke-width="2.5"/>
        <path d="M18 36 L27 45 L44 26" stroke="#2DD4BF" stroke-width="4" stroke-linecap="round" stroke-linejoin="round"/>
      </g>
    </g>

    <text x="64" y="70" class="mono">~/alexm2025 $ whoami</text>
    <text x="60" y="140" class="name" fill="url(#accent)">Alex Mathew</text>
    <text x="64" y="180" class="role">Computer Engineering @ FCRIT  ·  AI Security  ·  Full-Stack  ·  Blockchain</text>

    <g transform="translate(64 214)">
      <rect width="196" height="34" rx="17" fill="#0F172A" stroke="#2DD4BF" stroke-opacity="0.6"/>
      <circle cx="18" cy="17" r="4" fill="#2DD4BF"/><text x="106" y="22" text-anchor="middle" class="chip">SIH 2026 · Team Lead</text>
      <g transform="translate(210 0)">
        <rect width="262" height="34" rx="17" fill="#0F172A" stroke="#38BDF8" stroke-opacity="0.6"/>
        <circle cx="18" cy="17" r="4" fill="#38BDF8"/><text x="132" y="22" text-anchor="middle" class="chip">HACK ON TRACK · Runner-Up</text>
      </g>
      <g transform="translate(486 0)">
        <rect width="168" height="34" rx="17" fill="#0F172A" stroke="#8B5CF6" stroke-opacity="0.7"/>
        <circle cx="18" cy="17" r="4" fill="#8B5CF6"/><text x="100" y="22" text-anchor="middle" class="chip">Mumbai, India</text>
      </g>
    </g>
    <rect x="0" y="296" width="1200" height="4" fill="url(#accent)"/>
  </g>
</svg>
